<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>QTS Schedule Viewer</title><link rel="stylesheet" href="/static/style.css"><script src="/static/app.js" defer></script></head>
<body><header><div><small>QSV · 読み取り専用</small><h1>NAS のスケジュール</h1><p>QTS Schedule Viewer · QNAP 非公式ツール</p></div><button id="refresh">再取得</button></header>
<main><p id="notice" role="status">読み込み中…</p><section class="filters" aria-label="絞り込み"><input id="search" type="search" placeholder="スケジュールを検索" aria-label="全文検索"><select id="category" aria-label="カテゴリ"><option value="">すべてのカテゴリ</option></select><select id="provider" aria-label="提供元"><option value="">すべての提供元</option></select><select id="enabled" aria-label="有効状態"><option value="">すべての状態</option><option value="true">有効</option><option value="false">無効</option><option value="unknown">不明</option></select><a id="export" href="/api/export.csv">CSV 出力</a></section>
<nav aria-label="表示切り替え"><button data-view="week" aria-pressed="true">週間タイムライン</button><button data-view="list" aria-pressed="false">一覧</button><button data-view="status" aria-pressed="false">収集状況</button></nav>
<section id="week"><div class="week-controls"><button id="prev">← 前週</button><button id="today">今週 / 今日</button><button id="next">次週 →</button><input id="date" type="date" aria-label="表示日"><select id="mode" aria-label="週の形式"><option value="calendar">暦週（月曜始まり）</option><option value="rolling">指定日から7日間</option></select></div><p id="range"></p><p>予定時刻を表示しています。実行履歴・所要時間は含みません。数字は同じ時刻の件数です。</p><div class="timeline-scroll"><div id="timeline"></div></div><p id="timeline-note" role="status"></p></section>
<section id="list" hidden><h2>スケジュール一覧</h2><p id="count"></p><div class="table-scroll"><table><thead><tr><th>名前 / カテゴリ</th><th>提供元 / 状態</th><th>実行条件</th><th>次回実行予定 ↑</th><th>設定場所 / 取得元</th><th>取得状態</th></tr></thead><tbody id="rows"></tbody></table></div></section>
<section id="status" hidden><h2>収集状況</h2><p>cron 以外は実機調査待ちです。「タスクなし」と「取得不可」は区別しています。</p><div id="collections"></div></section>
<dialog id="detail"><button id="close">閉じる</button><h2 id="detail-title"></h2><pre id="detail-body"></pre></dialog></main></body></html>
