services:
  qsv:
    build: .
    restart: unless-stopped
    user: "${QSV_UID:-10001}:${QSV_GID:-10001}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      QSV_TIMEZONE: ${QSV_TIMEZONE:-Asia/Tokyo}
      QSV_REFRESH_SECONDS: ${QSV_REFRESH_SECONDS:-300}
      QSV_CRONTAB_PATH: /host/crontab
      QSV_ALLOWED_PROXY_IPS: ${QSV_ALLOWED_PROXY_IPS:?Set the LAN IP of server-a}
    volumes:
      - type: bind
        source: ${QSV_CRONTAB_SOURCE:-/etc/config/crontab}
        target: /host/crontab
        read_only: true
        bind:
          create_host_path: false
    ports:
      - target: 8000
        published: "${QSV_BIND_PORT:-18080}"
        host_ip: "${QSV_BIND_IP:?Set the QNAP LAN IP}"
        protocol: tcp
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
